<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復古零售 POS 收銀系統</title>
    <style>
        :root {
            --pos-bg: #d4d0c8;
            --pos-blue: #000080;
            --screen-green: #004000;
            --screen-text: #00ff00;
            --btn-blue: #c6d6f5;
            --btn-purple: #d5c6f5;
            --btn-green: #c6f5d6;
            --border-light: #ffffff;
            --border-dark: #808080;
        }
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #3a6ea5;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--pos-bg);
            border: 3px solid;
            border-color: var(--border-light) var(--border-dark) var(--border-dark) var(--border-light);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }
        .pos-header {
            background: linear-gradient(90deg, var(--pos-blue), #1084d0);
            color: white;
            padding: 6px 10px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        .pos-main-layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 10px;
        }
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .receipt-window {
            background-color: white;
            border: 2px solid inset;
            border-color: var(--border-dark) var(--border-light) var(--border-light) var(--border-dark);
            height: 320px;
            overflow-y: auto;
            padding: 5px;
        }
        .receipt-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .receipt-table th {
            background-color: #f1efe7;
            border: 1px solid var(--border-dark);
            padding: 5px;
        }
        .receipt-table td {
            padding: 6px 5px;
            border-bottom: 1px dashed #d4d0c8;
        }
        .row-in { color: #008000; font-weight: bold; }
        .row-out { color: #ff0000; font-weight: bold; }
        .total-screen-box {
            background-color: var(--screen-green);
            border: 3px solid inset;
            border-color: var(--border-dark) var(--border-light) var(--border-light) var(--border-dark);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--screen-text);
        }
        .total-amount {
            font-size: 36px;
            font-family: monospace;
            font-weight: bold;
        }
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .function-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .pos-btn {
            border: 2px solid;
            border-color: var(--border-light) var(--border-dark) var(--border-dark) var(--border-light);
            padding: 12px 2px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            background-color: var(--pos-bg);
        }
        .btn-blue-preset { background-color: var(--btn-blue); color: #000066; }
        .btn-purple-preset { background-color: var(--btn-purple); color: #400040; }
        .manual-input-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .manual-input-box input {
            padding: 8px;
            font-size: 16px;
            border: 2px solid;
            border-color: var(--border-dark) var(--border-light) var(--border-light) var(--border-dark);
        }
        .keypad-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background-color: #cbd5e0;
            padding: 8px;
            border: 2px solid;
            border-color: var(--border-dark) var(--border-light) var(--border-light) var(--border-dark);
        }
        .btn-key {
            background-color: var(--btn-green);
            color: #002000;
            font-size: 20px;
            padding: 15px 0;
            border: 2px solid;
            border-color: #ffffff #718096 #718096 #ffffff;
        }
        .btn-action-clear { background-color: #f5c6c6; color: #660000; }
        .btn-action-in { background-color: #bbf7d0; color: #005000; grid-column: span 2; font-size: 15px; }
        .btn-action-out { background-color: #fecaca; color: #7f1d1d; grid-column: span 2; font-size: 15px; }
        .ads-placeholder {
            width: 100%;
            height: 50px;
            background: #e2e8f0;
            border: 1px dashed var(--border-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #718096;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="pos-header">
        <span>傳統零售收銀系統 V2.8 (Retail Mode)</span>
        <span id="pos-time">00:00:00</span>
    </div>

    <div class="pos-main-layout">
        <div class="left-panel">
            <div class="receipt-window">
                <table class="receipt-table">
                    <thead>
                        <tr>
                            <th style="width: 25%;">時間</th>
                            <th style="width: 50%;">項目明細</th>
                            <th style="width: 25%; text-align: right;">金額</th>
                        </tr>
                    </thead>
                    <tbody id="receipt-body"></tbody>
                </table>
            </div>
            <div class="total-screen-box">
                <div style="font-size: 16px; font-weight: bold;">總結餘 TOTAL:</div>
                <div class="total-amount" id="total-display">$ 0.00</div>
            </div>
        </div>

        <div class="right-panel">
            <div class="function-grid">
                <button class="pos-btn btn-blue-preset" onclick="setPreset('飲食支出 🍛', 'out')">F5 飲食</button>
                <button class="pos-btn btn-blue-preset" onclick="setPreset('交通車資 🚌', 'out')">F6 交通</button>
                <button class="pos-btn btn-blue-preset" onclick="setPreset('購物消費 👕', 'out')">F7 購物</button>
                <button class="pos-btn btn-blue-preset" onclick="setPreset('娛樂消遣 🎬', 'out')">F8 娛樂</button>
                <button class="pos-btn btn-purple-preset" onclick="setPreset('買嘢飲 🧃', 'out')">F9 嘢飲</button>
                <button class="pos-btn btn-purple-preset" onclick="setPreset('超市雜貨 🛒', 'out')">F10 超市</button>
                <button class="pos-btn btn-purple-preset" onclick="setPreset('出糧人工 💰', 'in')">F11 出糧</button>
                <button class="pos-btn btn-purple-preset" onclick="setPreset('兼職外快 💸', 'in')">F12 兼職</button>
            </div>

            <div class="manual-input-box">
                <input type="text" id="item-desc" placeholder="點擊上方快捷鍵或在此手打" oninput="playBeep()">
            </div>

            <div class="manual-input-box">
                <input type="number" id="item-amount" placeholder="0.00" step="0.01" oninput="playBeep()" style="font-size: 20px; font-weight: bold; color: #004000;">
            </div>

            <div class="keypad-container">
                <button class="pos-btn btn-key" onclick="pressNum('7')">7</button>
                <button class="pos-btn btn-key" onclick="pressNum('8')">8</button>
                <button class="pos-btn btn-key" onclick="pressNum('9')">9</button>
                <button class="pos-btn btn-key btn-action-clear" onclick="pressClear()">清除</button>

                <button class="pos-btn btn-key" onclick="pressNum('4')">4</button>
                <button class="pos-btn btn-key" onclick="pressNum('5')">5</button>
                <button class="pos-btn btn-key" onclick="pressNum('6')">6</button>
                <button class="pos-btn btn-key" onclick="pressClearAll()" style="font-size:11px; background-color:#808080; color:white;">清空</button>

                <button class="pos-btn btn-key" onclick="pressNum('1')">1</button>
                <button class="pos-btn btn-key" onclick="pressNum('2')">2</button>
                <button class="pos-btn btn-key" onclick="pressNum('3')">3</button>
                <button class="pos-btn btn-key" onclick="pressNum('.')">.</button>

                <button class="pos-btn btn-key" onclick="pressNum('0')">0</button>
                <button class="pos-btn btn-key" onclick="pressNum('00')">00</button>
                <button class="pos-btn btn-action-in" onclick="registerTransaction('in')">收入入帳 (+)</button>
                <button class="pos-btn btn-action-out" onclick="registerTransaction('out')">支出入帳 (-)</button>
            </div>
        </div>
    </div>
    <div class="ads-placeholder">[Google AdSense 廣告空間預留 - 底部橫幅]</div>
</div>

<script>
    let totalBalance = 0;
    let audioCtx = null;
    let currentActiveType = 'out';

    setInterval(() => {
        const now = new Date();
        document.getElementById('pos-time').innerText = now.toLocaleTimeString([], {hour12: false});
    }, 1000);

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playBeep() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(1050, audioCtx.currentTime);
gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + 0.04);
}
function playCashRegisterSound() {
initAudio();
if (!audioCtx) return;
const osc1 = audioCtx.createOscillator();
const gain1 = audioCtx.createGain();
osc1.type = 'sine';
osc1.frequency.setValueAtTime(1550, audioCtx.currentTime);
osc1.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.12);
gain1.gain.setValueAtTime(0.2, audioCtx.currentTime);
gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
osc1.connect(gain1);
gain1.connect(audioCtx.destination);
const bufferSize = audioCtx.sampleRate * 0.2;
const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
const data = buffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
const noise = audioCtx.createBufferSource();
noise.buffer = buffer;
const filter = audioCtx.createBiquadFilter();
filter.type = 'bandpass';
filter.frequency.value = 1100;
const gain2 = audioCtx.createGain();
gain2.gain.setValueAtTime(0.12, audioCtx.currentTime + 0.05);
gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
noise.connect(filter);
filter.connect(gain2);
gain2.connect(audioCtx.destination);
osc1.start(); osc1.stop(audioCtx.currentTime + 0.35);
noise.start(audioCtx.currentTime + 0.05); noise.stop(audioCtx.currentTime + 0.22);
}
function setPreset(name, type) {
playBeep();
document.getElementById('item-desc').value = name;
currentActiveType = type;
document.getElementById('item-amount').focus();
}
document.querySelectorAll('.pos-btn').forEach(btn => {
btn.addEventListener('click', () => {
if(!btn.onclick) playBeep();
});
});
function pressNum(num) {
playBeep();
const amountInput = document.getElementById('item-amount');
if (amountInput.value === "" && (num === "." || num === "00")) {
amountInput.value = num === "." ? "0." : "0";
return;
}
amountInput.value += num;
}
function pressClear() {
playBeep();
document.getElementById('item-amount').value = '';
document.getElementById('item-desc').value = '';
currentActiveType = 'out';
}
function pressClearAll() {
playBeep();
if(confirm("確定要清空所有當前流水帳紀錄嗎？")) {
totalBalance = 0;
document.getElementById('total-display').innerText = $ 0.00;
document.getElementById('receipt-body').innerHTML = '';
}
}
function registerTransaction(forcedType) {
const descInput = document.getElementById('item-desc');
const amountInput = document.getElementById('item-amount');
const amount = parseFloat(amountInput.value);
if (isNaN(amount) || amount <= 0) {
alert("錯誤：請輸入有效金額！");
return;
}
const finalType = forcedType || currentActiveType;
const desc = descInput.value.trim() || (finalType === 'in' ? "收入進帳" : "支出銷帳");
playCashRegisterSound();
if (finalType === 'in') { totalBalance += amount; }
else { totalBalance -= amount; }
document.getElementById('total-display').innerText = $ ${totalBalance.toFixed(2)};
const receiptBody = document.getElementById('receipt-body');
const row = document.createElement('tr');
const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit', hour12: false});
const prefix = finalType === 'in' ? '+' : '-';
const typeClass = finalType === 'in' ? 'row-in' : 'row-out';


row.innerHTML = `

${timeStr}

${desc}

\(prefix\){amount.toFixed(2)}
`;
receiptBody.insertBefore(row, receiptBody.firstChild);
amountInput.value = '';
descInput.value = '';
currentActiveType = 'out';
}
</script>
</body>
</html>
